<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description }}" />
    <title>{{ page.get('title_tag', page.title ~ ' · ' ~ site.name) }}</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("personal-blog-theme");
        document.documentElement.dataset.theme = savedTheme === "aurora" ? "aurora" : "sky";
      } catch (_) { document.documentElement.dataset.theme = "sky"; }
    </script>
    <link rel="stylesheet" href="/assets/site.css?v=theme-toggle-1" />
    <script src="/assets/theme-switcher.js" defer></script>
  </head>
  <body class="{{ page.body_class or '' }}">
    <div class="shell">
      {% include "partials/header.html" %}
      <main>
        {% block content %}{% endblock %}
      </main>
      {% include "partials/footer.html" %}
    </div>
  </body>
</html>
